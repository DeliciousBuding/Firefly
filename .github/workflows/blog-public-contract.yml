name: Blog public contract

on:
  pull_request:
    branches: [vectorcontrol-blog]
  push:
    branches: [vectorcontrol-blog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-public-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.0"
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.14.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: pnpm astro check
      - name: Build production contract
        env:
          PUBLIC_SITE_ORIGIN: https://blog.vectorcontrol.tech
        run: pnpm build
      - name: Verify discovery and static headers
        env:
          PUBLIC_SITE_ORIGIN: https://blog.vectorcontrol.tech
        run: node scripts/verify-public-contract.mjs dist
