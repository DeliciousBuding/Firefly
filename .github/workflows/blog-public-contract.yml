name: Blog public contract

on:
  pull_request:
    branches: [vectorcontrol-blog]
  push:
    branches: [vectorcontrol-blog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-public-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.23.0"
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.14.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: pnpm astro check
      - name: Build production contract
        env:
          PUBLIC_SITE_ORIGIN: https://blog.vectorcontrol.tech
        run: pnpm build
      - name: Verify discovery and static headers
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/rss/index.xml
          test -f dist/_headers
          grep -Fq 'https://blog.vectorcontrol.tech' dist/index.html
          if grep -Fq 'https://blog-web.vectorcontrol.tech' dist/index.html dist/rss/index.xml; then
            echo 'staging origin leaked into production discovery output' >&2
            exit 1
          fi
          grep -Fq 'X-Content-Type-Options: nosniff' dist/_headers
